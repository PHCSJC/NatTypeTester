name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain
        shell: pwsh
        run: |
          msbuild -version
          Get-ChildItem "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework" -Name

      - name: Build (Release / Any CPU)
        shell: pwsh
        run: |
          msbuild NatTypeTester.sln /p:Configuration=Release /p:Platform="Any CPU" /v:normal /nologo 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 把编译错误行作为 annotation 暴露出来（否则只有 "exit code 1"，无法远程排查）
            $errs = Select-String -Path build.log -Pattern 'error|错误' -CaseSensitive:$false |
                     Select-Object -First 12
            foreach ($e in $errs) {
              $line = $e.Line -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
              Write-Host "::error file=build.log,line=$($e.LineNumber)::$line"
            }
            exit $code
          }

      - name: Collect artifact
        shell: pwsh
        run: |
          $src = "NatTypeTester\bin\Release"
          if (-not (Test-Path "$src\NatTypeTester.exe")) {
            Write-Error "build output not found: $src\NatTypeTester.exe"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "$src\NatTypeTester.exe" out\
          if (Test-Path "$src\NatTypeTester.exe.config") { Copy-Item "$src\NatTypeTester.exe.config" out\ }
          Get-ChildItem out | Format-Table Name, Length
          "SHA256 = " + (Get-FileHash "out\NatTypeTester.exe" -Algorithm SHA256).Hash

      - name: Build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NatTypeTester-friendly
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NatTypeTester-friendly
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
